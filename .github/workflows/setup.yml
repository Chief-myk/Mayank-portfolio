name: Setup Workflow 

on: 
  push:
    branches: [main]

jobs: 
  setup-my-app: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm install

      - name: Build App
        run: npm run build
