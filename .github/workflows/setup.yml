name: Setup Workflow 

on: 
  push:
    branches: [main]

jobs: 
  setup-my-app: 
    runs-on: ubuntu-latest

    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build App
        run: npm run build

      - name: Save Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/
